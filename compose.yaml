services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reuse_campus
      MYSQL_USER: reuse_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_demo_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_demo_root_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://reuse_user:${MYSQL_PASSWORD:-local_demo_password_change_me}@db:3306/reuse_campus
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-before-deployment-123456}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
