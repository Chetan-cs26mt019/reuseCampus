services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reuse_campus
      MYSQL_USER: reuse_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_demo_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_demo_root_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
    image: reusecampus-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://reuse_user:${MYSQL_PASSWORD:-local_demo_password_change_me}@db:3306/reuse_campus
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-key-change-before-deployment-123456}
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    image: reusecampus-frontend:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  demo-info:
    image: reusecampus-frontend:latest
    depends_on:
      frontend:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ""
        echo "========================================"
        echo "       ReUse Campus is READY!"
        echo "========================================"
        echo ""
        echo "FINAL DEMO WEBSITE:"
        echo "http://localhost:5173"
        echo ""
        echo "Backend API:"
        echo "http://localhost:8000"
        echo ""
        echo "API Documentation:"
        echo "http://localhost:8000/docs"
        echo ""
        echo "========================================"
    restart: "no"

volumes:
  mysql_data:
  hf_cache:
